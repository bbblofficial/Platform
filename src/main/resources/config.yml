# ==========================================================
#  Platform Configuration
#  Version: 1.0
#  Simple cosmetic PvP plugin
# ==========================================================
#
#  This file is AUTO-MERGED on plugin update.
#  New keys are added automatically.
#  Your existing values are NEVER overwritten.
# ==========================================================

# ----------------------------------------------------------
#  Spawn
#  Set with /platform setspawn
# ----------------------------------------------------------
spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ----------------------------------------------------------
#  Void
#  Players below this Y level get teleported back to spawn,
#  full-healed, and receive the cosmetic kit.
#  Set with /platform setvoid [y]
# ----------------------------------------------------------
void:
  kill-height: -13.0

# ----------------------------------------------------------
#  Join / Quit Messages
#  Placeholders:
#    %player%       - the player who joined/left
#    %online%       - current online count
#    %max_online%   - max players
# ----------------------------------------------------------
join-message: '&b%player% &7joined the game &8(&b%online%&7/&b%max_online%&8)'
quit-message: '&b%player% &7left the game &8(&b%online%&7/&b%max_online%&8)'

# ----------------------------------------------------------
#  Combo System
#  Broadcasts a message when a player reaches a combo milestone.
#
#  Placeholders:
#    %combo%     - the combo count (e.g. 10, 20, 30)
#    %attacker%  - the player who landed the combo
#    %victim%    - the player who got comboed
#
#  NOTE: Use "\n" inside double quotes for a new line.
#        Do NOT use block scalars (| or |-) for multi-line
#        messages, because "\n" will be treated as raw text.
# ----------------------------------------------------------
combo:
  enabled: true
  step: 10
  reset-time: 3000
  sound-enabled: true
  broadcast-message: "&8&m-------------------------------\n&6&lCOMBO &e&l%combo%x\n&e%attacker% &7got a combo on &c%victim% &7(&6%combo% &7combo)\n&8&m-------------------------------"